name: auto-update-data
on:
  schedule:
    - cron: "30 23 * * *"   # 每日 07:30 香港時間
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取官方來源並更新 data/*.json
        run: |
          python scripts/update_data.py
          python scripts/fetch_rso_history.py
      - name: 提交到 main 並同步 master
        run: |
          git config user.name "oshweb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "無資料變更"
          else
            git commit -m "🔄 自動更新職安資訊數據 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
          git push origin main:master --force-with-lease
