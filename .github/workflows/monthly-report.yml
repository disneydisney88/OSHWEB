name: monthly-injury-report
on:
  schedule:
    - cron: "0 1 1 * *"   # 每月1日 09:00 香港時間
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - name: 更新資料並生成上月工傷PDF報告
        run: |
          python scripts/update_data.py
          python scripts/monthly_report.py
      - name: 提交報告
        run: |
          git config user.name "oshweb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json reports/*.pdf
          if git diff --cached --quiet; then
            echo "無變更"
          else
            git commit -m "📄 自動生成月度工傷報告 $(date -u +'%Y-%m')"
            git push
          fi
